version: '3'

tasks:
  run_user:
    desc: run user service
    deps: [clean_task,gsqlc]
    dir: ./backend
    watch: true
    sources:
     - '**/*.go'
     - exclude: sqldb/*.go
    cmds:
      - go run ./cmd/user/.
      
  
  run_hokm_4:
    desc: run hokm 4 player service
    deps: [clean_task,gsqlc]
    dir: ./backend
    watch: true
    sources:
     - '**/*.go'
     - exclude: sqldb/*.go
    cmds:
      - go run ./cmd/hokm4/.
  
  clean_task:
    desc: clear task cache
    cmds:
      - rm -rf .task

  kill:
    desc: kills process using 5432 port
    cmds:
      - sudo kill $(sudo lsof -t -i:5432)
  
  caddy:
    desc: run caddy 
    cmds:
      - caddy run

  docker:
    desc: docker up
    dir: ./backend
    cmds:
      - sudo docker compose up -d
  
  gsqlc:
    desc: generate sqlc files
    dir: ./backend
    cmds:
      - sqlc generate
  
  export_pck:
    desc: export game content as pck
    dir: ./game
    cmds:
      - rm -f ./files/patches/*.pck
      - ~/Godot_v4.4-beta4_linux.x86_64 --headless --export-pack AndroidPck ../files/patches/system.pck

  upload_s3:
    desc: upload new version to s3
    dir: ./backend/tools/gos3
    cmds:
      - go run .

  release:
      prompt:
       - This is a dangerous command Do You Know what are you doing ???
       - Are you sure?
      cmds:
      - echo 'dangerous command'

dotenv: ['backend/.env']

  