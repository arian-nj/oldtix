version: "2"
sql:
  - engine: "postgresql"
    queries: "db/*query.sql"
    schema: "db/schema.sql"
    gen:
      go:
        package: "sqldb"
        out: "sqldb"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "bigserial"
            go_type:
              type: "int"
          
          - db_type: "bigserial"
            go_type:
              type: "int"
            nullable: true