services:

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: game
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Keeps data persistent
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  core_api:
    image: ghcr.io/arian-nj/tix-core:latest
    build:
      context: .
      dockerfile: core.Dockerfile
    ports:
     - 4444:4444
    environment:
      - CORE_HTTP_PORT=4444
      - BASE_URL=http://localhost:4444
      - SecretKey=/run/secrets/SecretKey
      - DATABASE_URL=postgres://admin:pass@db:5432/game?sslmode=disable
      - RELEASE_MODE=dev
      - VERSION=0.2.0
    deploy:
      replicas: 1
      update_config:
        order: start-first
    depends_on:
      - db
