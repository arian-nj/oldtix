services:
  reverse-proxy:
    image: traefik:v3.3
    networks:
      - default
    command:
      - "--providers.docker"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=filelord01@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--api.dashboard=true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.filelord.ir`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=myresolver"
      - "traefik.http.routers.traefik.service=api@internal"
    ports:
      - mode: host
        protocol: tcp
        published: 80
        target: 80
      - mode: host
        protocol: tcp
        published: 443
        target: 443
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
  
  db:
    image: postgres:latest
    networks:
      - default
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: game
    ports:
      - 0.0.0.0:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Keeps data persistent
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: amacneil/dbmate:latest
    networks:
      - default
    environment:
      DATABASE_URL: "postgres://admin:pass@db:5432/game?sslmode=disable"
    volumes:
      - ./backend/db/migrations:/db/migrations
    command: ["dbmate", "--wait", "up"]
    # deploy:
    #   replicas: 1
    #   restart_policy:
    #     condition: none
    
  core_api:
    image: ghcr.io/arian-nj/tix-core:${GIT_COMMIT_HASH}
    networks:
      - default
    build:
      context: .
      dockerfile: core.Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.web.loadbalancer.server.port=4444"
      - "traefik.http.routers.web.rule=Host(`hokm.filelord.ir`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=myresolver"
    secrets:
      - secret-key
    environment:
      - CORE_HTTP_PORT=4444
      - BASE_URL=https://hokm.filelord.ir
      - SecretKey=/run/secrets/secret-key
      - DATABASE_URL=postgres://admin:pass@db:5432/game?sslmode=disable
      - RELEASE_MODE=dev
      - VERSION=0.2.0
      - PROJECT_VERSION=${PROJECT_VERSION}
    deploy:
      update_config:
        order: start-first
    depends_on:
      - migrate
  # hokm4:
  #   build:
  #     context: .
  #     dockerfile: hokm4.Dockerfile
  #   ports:
  #    - 127.0.0.1:4445:4445
  #   environment:
  #     - HTTP_PORT=${HOKM4_HTTP_PORT}
  #     - BASE_URL=${BASE_URL}
  #     - SecretKey=${SecretKey}
  #     - DATABASE_URL=${DATABASE_URL}
  #     - RELEASE_MODE=${RELEASE_MODE}
  #     - VERSION=${VERSION}

volumes:
  postgres_data:
  letsencrypt:

secrets:
  secret-key: 
    external: true

networks:
  default: # This targets the default network created for the stack
    driver: overlay
    attachable: true 
