services:
  reverse-proxy:
    image: traefik:v3.3
    command:
      - "--providers.docker"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=filelord01@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--api.dashboard=true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=PathPrefix(`/traefik`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=myresolver"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=treafik-strip"
    ports:
      - mode: host
        protocol: tcp
        published: 80
        target: 80
      - mode: host
        protocol: tcp
        published: 443
        target: 443
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
  
  core_api:
    image: ghcr.io/arian-nj/tix-core:${GIT_COMMIT_HASH}
    build:
      context: .
      dockerfile: core.Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.core_api.loadbalancer.server.port=4444"
      - "traefik.http.routers.core_api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.core_api.entrypoints=websecure"
      - "traefik.http.routers.core_api.tls.certresolver=myresolver"
      - "traefik.http.routers.core-api.middlewares=api-strip"
    secrets:
      - secret-key
    environment:
      - CORE_HTTP_PORT=4444
      - BASE_URL=https://core.filelord.ir
      - SECRET_KEY_FILE=/run/secrets/secret-key
      - DATABASE_URL=postgres://pgadmin:sdoi32dfEF03Rf3f3g@db:5432/game?sslmode=disable
      - RELEASE_MODE=dev
      - PROJECT_VERSION=${PROJECT_VERSION}
    deploy:
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first

  hokm4:
    image: ghcr.io/arian-nj/tix-hokm4:${GIT_COMMIT_HASH}
    build:
      context: .
      dockerfile: hokm4.Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.hokm4_api.loadbalancer.server.port=4445"
      - "traefik.http.routers.hokm4_api.rule=PathPrefix(`/hokm4`)"
      - "traefik.http.routers.hokm4_api.entrypoints=websecure"
      - "traefik.http.routers.hokm4_api.tls.certresolver=myresolver"
      - "traefik.http.routers.hokm4_api.middlewares=hokm4-strip"

    secrets:
      - secret-key
    environment:
      - HOKM4_HTTP_PORT=4445
      - BASE_URL=https://hokm4.filelord.ir
      - SECRET_KEY_FILE=/run/secrets/secret-key
      - DATABASE_URL=postgres://pgadmin:sdoi32dfEF03Rf3f3g@db:5432/game?sslmode=disable
      - RELEASE_MODE=dev
      - PROJECT_VERSION=${PROJECT_VERSION}
    deploy:
      update_config:
        order: start-first

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: sdoi32dfEF03Rf3f3g
      POSTGRES_DB: game
    ports:
      - 0.0.0.0:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Keeps data persistent
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  letsencrypt:

secrets:
  secret-key: 
    external: true
